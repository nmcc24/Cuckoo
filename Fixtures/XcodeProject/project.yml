# The Xcode project CI builds to cover the plugin's Xcode entry point: three frameworks, each with a test target whose
# Cuckoofile entry lists its sources, one of them named with a space. Ledger and LedgerTests use synchronized folders,
# the default for a new Xcode project, whose files Xcode reads from disk: CI adds a file to each and builds again. XApp.xcodeproj is generated from this file
# with XcodeGen (`xcodegen` in this folder); regenerate it after changing this file.
name: XApp
options:
  deploymentTarget: {macOS: "14.0"}
packages:
  Cuckoo:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
targets:
  Shop:
    type: framework
    platform: macOS
    sources: [Shop]
    settings: {base: {PRODUCT_BUNDLE_IDENTIFIER: org.cuckoo.fixture.shop, ENABLE_TESTABILITY: "YES"}}
  Core:
    type: framework
    platform: macOS
    sources: [Core]
    settings: {base: {PRODUCT_BUNDLE_IDENTIFIER: org.cuckoo.fixture.core, ENABLE_TESTABILITY: "YES"}}
  Ledger:
    type: framework
    platform: macOS
    sources: [{path: Ledger, type: syncedFolder}]
    settings: {base: {PRODUCT_BUNDLE_IDENTIFIER: org.cuckoo.fixture.ledger, ENABLE_TESTABILITY: "YES"}}
  LedgerTests:
    type: bundle.unit-test
    platform: macOS
    sources: [{path: LedgerTests, type: syncedFolder}]
    settings: {base: {PRODUCT_BUNDLE_IDENTIFIER: org.cuckoo.fixture.ledgertests}}
    dependencies:
      - target: Ledger
      - package: Cuckoo
        product: Cuckoo
    buildToolPlugins:
      - plugin: CuckooPlugin
        package: Cuckoo
  CoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CoreTests]
    settings: {base: {PRODUCT_BUNDLE_IDENTIFIER: org.cuckoo.fixture.coretests}}
    dependencies:
      - target: Core
      - package: Cuckoo
        product: Cuckoo
    buildToolPlugins:
      - plugin: CuckooPlugin
        package: Cuckoo
  Shop Tests:
    type: bundle.unit-test
    platform: macOS
    sources: [ShopTests]
    settings: {base: {PRODUCT_BUNDLE_IDENTIFIER: org.cuckoo.fixture.shoptests}}
    dependencies:
      - target: Shop
      - package: Cuckoo
        product: Cuckoo
    buildToolPlugins:
      - plugin: CuckooPlugin
        package: Cuckoo
schemes:
  XApp:
    build: {targets: {Shop: all, Shop Tests: [test], Core: all, CoreTests: [test], Ledger: all, LedgerTests: [test]}}
    test: {targets: [Shop Tests, CoreTests, LedgerTests]}
  # Builds one framework and its tests alone, so a test target that got another's mocks fails to build.
  ShopOnly:
    build: {targets: {Shop: all, Shop Tests: [test]}}
    test: {targets: [Shop Tests]}
