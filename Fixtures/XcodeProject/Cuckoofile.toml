# An Xcode project's Cuckoofile: each entry is named after a test target and lists the files to mock. Xcode doesn't
# tell the build plugin which of the project's targets a test target depends on. One test target's name has a
# space, so its key is quoted.
[modules."Shop Tests"]
testableImports = ["Shop"]
sources = ["Shop/**/*.swift"]

[modules.CoreTests]
testableImports = ["Core"]
sources = ["Core/**/*.swift"]
