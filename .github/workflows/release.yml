name: Release
# Releases a version with the prebuilt generator (roadmap Phase 5 item 2, option B). Run it by hand on master, with
# the version that `version` and Generator/Sources/CLI/Version.swift already hold (bump them in a PR first).
#
# It builds the generator's `artifactbundle` for macOS (universal) and Linux (x86_64 and arm64), tests it the way a
# user gets it, then tags one commit off master that points the plugins at the bundle, and publishes the release
# with the bundle attached. Master keeps building the generator from source; only the tag carries the binary.
#
# The Linux parts are built on Ubuntu 22.04 (`-jammy`), so the binary needs glibc 2.35 at most and runs on 22.04 or
# later, and on other distributions with that glibc or newer. A dry run stops after the smoke tests.
#
# The verify jobs run after the release is public, and releases are immutable: its tag and zip can't be replaced.
# If one fails, say so in the release's notes, fix master, and release the next version (the next beta, or a patch).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 3.0.0 or 3.0.0-beta.1 (a pre-release when it has a suffix)
        required: true
      dry_run:
        description: Build and smoke-test the bundle only, without tagging or publishing anything
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

# Each job's timeout is about three times its usual run, so a hung job fails rather than running for six hours.
jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: The version matches the sources, and its tag is free
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/master ]] || { echo "::error::Release from master, not $GITHUB_REF."; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Not a version: $VERSION"; exit 1; }
          [[ "$(cat version)" == "$VERSION" ]] || { echo "::error::The version file holds $(cat version)."; exit 1; }
          grep -qxF "let version = \"$VERSION\"" Generator/Sources/CLI/Version.swift \
            || { echo "::error::Generator/Sources/CLI/Version.swift doesn't hold $VERSION."; exit 1; }
          # A dry run never tags, so it may rebuild a released version, which master's sources hold until the next bump.
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            if [[ "$DRY_RUN" == true ]]; then
              echo "::notice::The tag $VERSION exists; a dry run doesn't tag, so it goes on."
            else
              echo "::error::The tag $VERSION already exists."; exit 1
            fi
          fi
          # The release's notes are this version's changelog section. Checked here, before anything is built or
          # tagged: the release job pushes the tag before it publishes, so a missing section found there would leave
          # a tag whose Package.swift points at a release that doesn't exist.
          scripts/release-notes.sh "$VERSION" >/dev/null \
            || { echo "::error::CHANGELOG.md has no section '## $VERSION'."; exit 1; }
      - name: Master's CI passed on this commit
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release ships this commit as it is, so it must have passed the same gate as every merge. A dry run may
          # go on without it, to try a commit whose CI hasn't finished. A re-run of the CI adds another `CI passed`
          # check run; the latest one counts.
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=CI%20passed&filter=latest" \
            --jq '.check_runs | sort_by(.started_at) | last | .conclusion // "missing"')" || conclusion=unavailable
          if [[ "$conclusion" != success ]]; then
            message="CI passed is '$conclusion' on $GITHUB_SHA, not success."
            if [[ "$DRY_RUN" == true ]]; then
              echo "::warning::$message A dry run goes on."
            else
              echo "::error::$message Wait for master's CI, or fix it, before releasing."; exit 1
            fi
          fi

  build:
    name: Build the generator (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: macOS, runner: macos-26 }
          - { name: Linux x86_64, runner: ubuntu-latest, container: "swift:6.3-jammy" }
          - { name: Linux arm64, runner: ubuntu-26.04-arm, container: "swift:6.3-jammy" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        run: scripts/build-artifactbundle.sh build parts
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: part-${{ runner.os }}-${{ runner.arch }}
          path: parts
          if-no-files-found: error

  bundle:
    name: Bundle and smoke-test (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: macOS, runner: macos-26 }
          - { name: Linux x86_64, runner: ubuntu-latest, container: "swift:6.3-jammy" }
          - { name: Linux arm64, runner: ubuntu-26.04-arm, container: "swift:6.3-jammy" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install zip
        if: runner.os == 'Linux'
        run: apt-get update -qq && apt-get install -y -qq zip
      - name: Download the parts
        uses: actions/download-artifact@v8
        with:
          pattern: part-*
          path: parts
      - name: Bundle
        # Every leg merges the same parts; the macOS leg's zip is the one released.
        run: scripts/build-artifactbundle.sh merge "$VERSION" bundle/CuckooGenerator.artifactbundle parts/*
      - name: Smoke test
        run: scripts/smoke-test-artifactbundle.sh bundle/CuckooGenerator.artifactbundle
      - name: Upload the bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: bundle/CuckooGenerator.artifactbundle.zip
          if-no-files-found: error

  release:
    name: Tag and publish
    needs: bundle
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download the bundle
        uses: actions/download-artifact@v8
        with:
          name: bundle
          path: bundle
      - name: Release commit and tag
        # The tagged commit is master plus this one change; it isn't pushed to any branch. A re-run after a later
        # step failed finds the tag already pushed, and keeps it if it names this bundle.
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/CuckooGenerator.artifactbundle.zip"
          # SwiftPM's checksum of a binary target is the SHA-256 of the zip, so this job needs no Swift toolchain.
          checksum="$(sha256sum bundle/CuckooGenerator.artifactbundle.zip | cut -d' ' -f1)"
          if git fetch --quiet origin "refs/tags/$VERSION:refs/tags/$VERSION" 2>/dev/null; then
            if git show "$VERSION:Package.swift" | grep -qF "$checksum"; then
              echo "The tag $VERSION already names this bundle."
              exit 0
            fi
            echo "::error::The tag $VERSION exists and names another bundle."; exit 1
          fi
          scripts/set-prebuilt-generator.sh remote "$url" "$checksum"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Release $VERSION with the prebuilt generator" -m "Checksum: $checksum"
          git tag -a "$VERSION" -m "Cuckoo $VERSION"
          git push origin "refs/tags/$VERSION"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "The release $VERSION is already published."
            exit 0
          fi
          # The notes are the version's section of the changelog, which the check job already found.
          scripts/release-notes.sh "$VERSION" > notes.md
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$VERSION" bundle/CuckooGenerator.artifactbundle.zip \
            --verify-tag --title "$VERSION" --notes-file notes.md "${prerelease[@]}"

  verify:
    name: Resolve the release by its tag (${{ matrix.name }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, runner: macos-26 }
          - { name: Linux x86_64, runner: ubuntu-latest, container: "swift:6.3" }
          - { name: Linux arm64, runner: ubuntu-26.04-arm, container: "swift:6.3" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Smoke test against the published tag
        run: scripts/smoke-test-artifactbundle.sh --tag "$VERSION"
