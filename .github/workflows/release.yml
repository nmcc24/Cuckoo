name: Release
# Releases a version with the prebuilt generator (roadmap Phase 5 item 2, option B). Run it by hand on master, with
# the version that Generator/Sources/CLI/Version.swift already holds (bump it in a PR first).
#
# It builds the generator's `artifactbundle` for macOS (universal) and Linux (x86_64 and arm64), zips it once, tests
# that zip the way a user gets it on macOS and on Linux with every supported Swift version (6.2 to 6.4), then tags
# one commit off master that points the plugins at the bundle, and publishes the release with the bundle attached.
# Master keeps building the generator from source; only the tag carries the binary.
#
# The Linux parts are built on Ubuntu 22.04 (`-jammy`), so the binary needs glibc 2.35 at most and runs on 22.04 or
# later, and on other distributions with that glibc or newer. A dry run stops after the smoke tests.
#
# The verify jobs run after the release is public, and releases are immutable (the immutable job checks it): its tag
# and zip can't be replaced. If one fails, say so in the release's notes, fix master, and release the next version
# (the next beta, or a patch). A run that fails before publishing can be re-run, or run again from the start.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 3.0.0 or 3.0.0-beta.1 (a pre-release when it has a suffix)
        required: true
      dry_run:
        description: Build and smoke-test the bundle only, without tagging or publishing anything
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

# Container jobs would otherwise run `sh`, without `pipefail`: a failed command before a pipe would pass.
defaults:
  run:
    shell: bash

# Each job's timeout is about three times its usual run, so a hung job fails rather than running for six hours.
jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The version matches the sources, and it isn't released yet
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/master ]] || { echo "::error::Release from master, not $GITHUB_REF."; exit 1; }
          # Before anything is built or tagged: the release job pushes the tag before it publishes, so a missing
          # changelog section found there would leave a tag whose Package.swift points at a release that doesn't exist.
          scripts/check-version.sh "$VERSION"
          # A dry run never tags, so it may rebuild a released version, which master's sources hold until the next bump.
          # A tag with no published release was left by a run that failed before publishing: the release job moves it.
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            if [[ "$DRY_RUN" == true ]]; then
              echo "::notice::The tag $VERSION exists; a dry run doesn't tag, so it goes on."
            elif [[ "$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
              echo "::error::$VERSION is already released."; exit 1
            else
              echo "::notice::The tag $VERSION exists without a published release; this run moves it to its own commit."
            fi
          fi
      - name: Master's CI passed on this commit
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release ships this commit as it is, so it must have passed the same gate as every merge. A dry run may
          # go on without it, to try a commit whose CI hasn't finished. A re-run of the CI adds another `CI passed`
          # check run; the latest one counts.
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=CI%20passed&filter=latest" \
            --jq '.check_runs | sort_by(.started_at) | last | .conclusion // "missing"')" || conclusion=unavailable
          if [[ "$conclusion" != success ]]; then
            message="CI passed is '$conclusion' on $GITHUB_SHA, not success."
            if [[ "$DRY_RUN" == true ]]; then
              echo "::warning::$message A dry run goes on."
            else
              echo "::error::$message Wait for master's CI, or fix it, before releasing."; exit 1
            fi
          fi

  build:
    name: Build the generator (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: macOS, runner: macos-26 }
          - { name: Linux x86_64, runner: ubuntu-latest, container: "swift:6.3-jammy" }
          - { name: Linux arm64, runner: ubuntu-26.04-arm, container: "swift:6.3-jammy" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: scripts/build-artifactbundle.sh build parts
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: part-${{ runner.os }}-${{ runner.arch }}
          path: parts
          if-no-files-found: error

  bundle:
    name: Bundle and smoke-test (macOS)
    needs: build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: part-*
          path: parts
      - name: Bundle
        env:
          # Every platform the release ships; a missing part fails the merge.
          REQUIRED_TRIPLES: arm64-apple-macosx x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
        run: scripts/build-artifactbundle.sh merge "$VERSION" bundle/CuckooGenerator.artifactbundle parts/*
      - name: The release commit's manifest
        run: |
          # The manifest the tag will carry, with the URL the release will have and this zip's checksum: SwiftPM must
          # read it before anything is tagged. It can't download the zip yet, so it only loads the manifest.
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/CuckooGenerator.artifactbundle.zip"
          checksum="$(shasum -a 256 bundle/CuckooGenerator.artifactbundle.zip | cut -d' ' -f1)"
          scripts/set-prebuilt-generator.sh remote "$url" "$checksum"
          swift package dump-package > /dev/null
          git checkout -- Package.swift
      - name: Smoke test
        run: scripts/smoke-test-artifactbundle.sh bundle/CuckooGenerator.artifactbundle
      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: bundle/CuckooGenerator.artifactbundle.zip
          if-no-files-found: error

  # The zip the release attaches, unpacked and smoke-tested on Linux with every Swift version a consumer may use.
  smoke_linux:
    name: Smoke-test the bundle (${{ matrix.name }})
    needs: bundle
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: Linux x86_64 Swift 6.2, runner: ubuntu-latest, container: "swift:6.2" }
          - { name: Linux arm64 Swift 6.2, runner: ubuntu-26.04-arm, container: "swift:6.2" }
          - { name: Linux x86_64 Swift 6.3, runner: ubuntu-latest, container: "swift:6.3" }
          - { name: Linux arm64 Swift 6.3, runner: ubuntu-26.04-arm, container: "swift:6.3" }
          - { name: Linux x86_64 Swift 6.4, runner: ubuntu-latest, container: "swift:6.4" }
          - { name: Linux arm64 Swift 6.4, runner: ubuntu-26.04-arm, container: "swift:6.4" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install unzip
        run: apt-get update -qq && apt-get install -y -qq unzip
      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: bundle
      - name: Smoke test
        run: |
          unzip -q bundle/CuckooGenerator.artifactbundle.zip -d bundle
          scripts/smoke-test-artifactbundle.sh bundle/CuckooGenerator.artifactbundle

  release:
    name: Tag and publish
    needs: [bundle, smoke_linux]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      # The provenance attestation: a signed statement, which `gh attestation verify` checks, that this workflow
      # built the zip from this commit.
      id-token: write
      attestations: write
    steps:
      # A matrix job's result reads `success` even when some of its legs were cancelled, such as one that never got
      # a runner, so nothing is tagged unless every build and smoke-test leg of this run succeeded.
      - name: Every build and smoke test succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          not_passed="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest" \
            --jq '.jobs[] | select(.name | startswith("Build the generator") or startswith("Bundle and smoke-test")
              or startswith("Smoke-test the bundle")) | select(.conclusion != "success") | "\(.name): \(.conclusion // .status)"')"
          if [[ -n "$not_passed" ]]; then
            echo "::error::Not every leg succeeded:"$'\n'"$not_passed"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: bundle
      - name: Attest the bundle's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: bundle/CuckooGenerator.artifactbundle.zip
      # The draft holds the bundle before the tag exists, so the tag is public only for the moment before publishing,
      # and an `exact:` pin of it doesn't resolve to a missing zip. A draft isn't public or immutable yet.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft="$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$draft" == false ]]; then
            echo "The release $VERSION is already published."
            exit 0
          elif [[ "$draft" == true ]]; then
            # A failed run left a draft, maybe with another bundle: replace it.
            echo "::notice::Replacing the draft release $VERSION a previous run left."
            gh release delete "$VERSION" --yes
          fi
          # The notes are the version's section of the changelog, which the check job already found.
          scripts/release-notes.sh "$VERSION" > notes.md
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$VERSION" bundle/CuckooGenerator.artifactbundle.zip \
            --draft --title "$VERSION" --notes-file notes.md "${prerelease[@]}"
      - name: Release commit and tag
        # The tagged commit is master plus this one change; it isn't pushed to any branch. A run can fail between
        # tagging and publishing. Re-running the failed jobs finds the tag naming this bundle and keeps it; a new run,
        # with a new bundle, moves the tag, which no published release holds yet (the check job made sure). Once the
        # release is published, immutability locks the tag.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/CuckooGenerator.artifactbundle.zip"
          # SwiftPM's checksum of a binary target is the SHA-256 of the zip, so this job needs no Swift toolchain.
          checksum="$(sha256sum bundle/CuckooGenerator.artifactbundle.zip | cut -d' ' -f1)"
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Not a SHA-256 checksum: '$checksum'."; exit 1; }
          push=(git push origin "refs/tags/$VERSION")
          if git fetch --quiet origin "refs/tags/$VERSION:refs/tags/$VERSION" 2>/dev/null; then
            if git show "$VERSION:Package.swift" | grep -qF "$checksum"; then
              echo "The tag $VERSION already names this bundle."
              exit 0
            fi
            if [[ "$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
              echo "::error::$VERSION was released with another bundle while this run was building."; exit 1
            fi
            echo "::notice::Moving the tag $VERSION, which a failed run left, to this run's bundle."
            git tag -d "$VERSION" >/dev/null
            push=(git push --force origin "refs/tags/$VERSION")
          fi
          scripts/set-prebuilt-generator.sh remote "$url" "$checksum"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Release $VERSION with the prebuilt generator" -m "Checksum: $checksum"
          git tag -a "$VERSION" -m "Cuckoo $VERSION"
          "${push[@]}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" == false ]]; then
            echo "The release $VERSION is already published."
            exit 0
          fi
          gh release edit "$VERSION" --draft=false --verify-tag

  immutable:
    name: The release is immutable
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Immutability is a repository setting. Without it, the release's tag and zip could be replaced, and a
          # package that resolved the old checksum would fail to build.
          immutable="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" --jq .immutable)"
          [[ "$immutable" == true ]] || { echo "::error::The release $VERSION isn't immutable ($immutable). Turn on immutable releases in the repository's settings."; exit 1; }

  verify:
    name: Resolve the release by its tag (${{ matrix.name }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, runner: macos-26 }
          - { name: Linux x86_64 Swift 6.2, runner: ubuntu-latest, container: "swift:6.2" }
          - { name: Linux arm64 Swift 6.2, runner: ubuntu-26.04-arm, container: "swift:6.2" }
          - { name: Linux x86_64 Swift 6.3, runner: ubuntu-latest, container: "swift:6.3" }
          - { name: Linux arm64 Swift 6.3, runner: ubuntu-26.04-arm, container: "swift:6.3" }
          - { name: Linux x86_64 Swift 6.4, runner: ubuntu-latest, container: "swift:6.4" }
          - { name: Linux arm64 Swift 6.4, runner: ubuntu-26.04-arm, container: "swift:6.4" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Smoke test against the published tag
        run: scripts/smoke-test-artifactbundle.sh --tag "$VERSION"
