name: Run tests
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every macOS job uses its image's default Xcode, so each image covers one Swift version.
# macos-15 isn't used: its default is Xcode 16.4 / Swift 6.1, below the Swift 6.2 minimum.
# Swift 6.4 made swiftbuild the default build system; older toolchains use the native one.
# 6.4 is tested with both so neither layout regresses.
# Package.resolved pins the newest swift-syntax; one Linux job also builds against the
# lowest version Package.swift allows, so both ends of the range stay tested.
jobs:
  generator_linux:
    name: Generator tests and Swift 6 matrix on Linux (Swift ${{ matrix.swift }}, ${{ matrix.build-system }}${{ matrix.swift-syntax && format(', swift-syntax {0}', matrix.swift-syntax) || '' }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { swift: "6.2", build-system: native }
          - { swift: "6.2", build-system: native, swift-syntax: "600.0.0" }
          - { swift: "6.3", build-system: native }
          - { swift: "6.4", build-system: swiftbuild }
          - { swift: "6.4", build-system: native }
    env:
      SWIFT_BUILD_FLAGS: --build-system ${{ matrix.build-system }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Pin swift-syntax ${{ matrix.swift-syntax }}
        if: matrix.swift-syntax
        # A fresh checkout has no resolved dependencies yet, so resolve them before pinning one.
        run: |
          swift package resolve
          swift package resolve swift-syntax --version ${{ matrix.swift-syntax }}
      - name: Generator tests
        run: swift test $SWIFT_BUILD_FLAGS
      - name: Swift 6 matrix
        run: scripts/swift6-matrix.sh

  generator_macOS:
    name: Generator tests and Swift 6 matrix on ${{ matrix.runner }} (${{ matrix.build-system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, build-system: native }
          - { runner: xcode-27, build-system: swiftbuild }
          - { runner: xcode-27, build-system: native }
    env:
      SWIFT_BUILD_FLAGS: --build-system ${{ matrix.build-system }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Show toolchain
        run: |
          ls -d /Applications/Xcode*.app
          echo "::notice title=Toolchain::$(xcodebuild -version | tr '\n' ' ')/ $(swift --version 2>&1 | head -1) / SDKROOT=${SDKROOT:-unset}"
      - name: Build package
        run: swift build $SWIFT_BUILD_FLAGS
      - name: Generator tests
        run: swift test $SWIFT_BUILD_FLAGS
      - name: Swift 6 matrix
        run: scripts/swift6-matrix.sh

  test_macOS:
    name: Build and Test on macOS (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Show toolchain
        run: echo "::notice title=Toolchain::$(xcodebuild -version | tr '\n' ' ')/ $(swift --version 2>&1 | head -1)"
      - uses: jdx/mise-action@v2
        with:
          install: false
          experimental: true
      - name: Test
        run: |
          make
          set -o pipefail && xcodebuild test -scheme "Cuckoo-macOS" -workspace Cuckoo.xcworkspace \
            | xcbeautify --renderer github-actions

  test_iOS:
    name: Build and Test on iOS simulator (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Show toolchain
        run: echo "::notice title=Toolchain::$(xcodebuild -version | tr '\n' ' ')/ $(swift --version 2>&1 | head -1)"
      - uses: jdx/mise-action@v2
        with:
          install: false
          experimental: true
      - name: Test
        run: |
          make
          # Use whichever iPhone simulator the image ships, rather than pinning a model and OS.
          SIMULATOR_ID="$(xcrun simctl list devices available iPhone | grep -m1 -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')"
          echo "::notice title=Simulator::$(xcrun simctl list devices available | grep "$SIMULATOR_ID")"
          set -o pipefail && xcodebuild test -scheme "Cuckoo-iOS" -workspace Cuckoo.xcworkspace \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            | xcbeautify --renderer github-actions

  # The single check that master's ruleset requires. It depends on every other job, so
  # adding or removing matrix entries never leaves the ruleset requiring a stale check name.
  ci_passed:
    name: CI passed
    if: always()
    needs: [generator_linux, generator_macOS, test_macOS, test_iOS]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
