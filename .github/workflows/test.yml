name: Run tests
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generator_linux:
    name: Generator tests and Swift 6 matrix on Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3", "6.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Generator tests
        run: swift test
      - name: Swift 6 matrix
        run: scripts/swift6-matrix.sh

  generator_macOS:
    name: Generator tests and Swift 6 matrix on macOS (newest Xcode)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      - name: Generator tests
        run: swift test
      - name: Swift 6 matrix
        run: scripts/swift6-matrix.sh

  build_macOS:
    name: Build Package on macOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: List available Xcode versions
        run: ls /Applications | grep Xcode
      - name: Show current version of Xcode
        run: xcodebuild -version
      - name: Build Package
        run: swift build

  test_macOS:
    name: Build and Test on macOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: List available Xcode versions
        run: ls /Applications | grep Xcode
      - name: Show current version of Xcode
        run: xcodebuild -version
      - uses: jdx/mise-action@v2
        with:
          install: false
          experimental: true
      - name: Test
        run: |
          make
          set -o pipefail && xcodebuild test -scheme "Cuckoo-macOS" -workspace Cuckoo.xcworkspace \
            | xcbeautify --renderer github-actions

  test_iOS:
    name: Build and Test on iOS simulator
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: List available Xcode versions
        run: ls /Applications | grep Xcode
      - name: Show current version of Xcode
        run: xcodebuild -version
      - uses: jdx/mise-action@v2
        with:
          install: false
          experimental: true
      - name: Test
        run: |
          make
          set -o pipefail && xcodebuild test -scheme "Cuckoo-iOS" -workspace Cuckoo.xcworkspace \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=18.6" \
            | xcbeautify --renderer github-actions
