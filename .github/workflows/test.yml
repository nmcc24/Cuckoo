name: Run tests
# A branch with a pull request is tested once, by its pull_request run, which reports the
# required "CI passed" check. Pushes are tested only on master, after a merge. Run the workflow
# by hand (workflow_dispatch) to test a branch without a pull request.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
# One run per pull request (or per branch for the other events). A new push to a pull request
# cancels its run in progress; runs on master always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The jobs only read the repository; a job that needs more asks for it.
permissions:
  contents: read

# Every macOS job uses its image's default Xcode, so each image covers one Swift version.
# macos-15 isn't used: its default is Xcode 16.4 / Swift 6.1, below the Swift 6.2 minimum.
# Swift 6.4 made swiftbuild the default build system; older toolchains use the native one.
# SwiftPM 6.4 deprecates native, so Linux tests 6.4 with swiftbuild only. On macOS each image runs only its
# default build system, because macOS runners queue far longer than Linux ones.
# Package.resolved pins the newest swift-syntax; Linux jobs also pin the first release of every older major
# Package.swift allows, so each one the generator can build with stays tested.
# Each job's timeout is about three times its usual run, so a hung job fails rather than running for six hours.
jobs:
  generator_linux:
    name: SwiftPM tests and Swift 6 matrix on Linux (Swift ${{ matrix.swift }}, ${{ matrix.build-system }}${{ matrix.swift-syntax && format(', swift-syntax {0}', matrix.swift-syntax) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { swift: "6.2", build-system: native }
          - { swift: "6.2", build-system: native, swift-syntax: "602.0.0" }
          - { swift: "6.3", build-system: native, swift-syntax: "603.0.0" }
          - { swift: "6.3", build-system: native }
          - { swift: "6.4", build-system: swiftbuild }
    env:
      SWIFT_BUILD_FLAGS: --build-system ${{ matrix.build-system }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pin swift-syntax ${{ matrix.swift-syntax }}
        if: matrix.swift-syntax
        # A fresh checkout has no resolved dependencies yet, so resolve them before pinning one.
        run: |
          swift package resolve
          swift package resolve swift-syntax --version ${{ matrix.swift-syntax }}
      - name: Generator and runtime tests
        run: swift test $SWIFT_BUILD_FLAGS
      - name: Swift 6 matrix
        run: scripts/swift6-matrix.sh
      - name: Swift 6 matrix with default MainActor isolation
        run: scripts/swift6-matrix.sh -default-isolation MainActor
        env:
          SWIFT6_MATRIX_EXPECTED: Fixtures/Swift6/expected-failures-default-mainactor.txt

  # The Swift 7 language mode's upcoming features, which projects can already turn on. Our targets adopt the ones
  # that only change what compiles (Package.swift); this job adds the rest. Generated mocks build in the user's
  # module with the user's settings, so the fixtures also build with every feature on, and the way a new Xcode 26
  # project builds its code (default MainActor isolation plus Approachable Concurrency). Each list of expected
  # failures is the one its configuration shares with the generator_linux job.
  swift7_linux:
    name: Swift 7 upcoming features on Linux (Swift ${{ matrix.swift }}, ${{ matrix.build-system }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { swift: "6.2", build-system: native }
          - { swift: "6.4", build-system: swiftbuild }
    env:
      SWIFT_BUILD_FLAGS: --build-system ${{ matrix.build-system }}
      FEATURES: >-
        ExistentialAny MemberImportVisibility InternalImportsByDefault
        InferIsolatedConformances NonisolatedNonsendingByDefault ImmutableWeakCaptures
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Generator and runtime tests with every feature on
        run: CUCKOO_UPCOMING_FEATURES="$(echo $FEATURES | tr ' ' ',')" swift test $SWIFT_BUILD_FLAGS
      - name: Swift 6 matrix with every feature on
        run: scripts/swift6-matrix.sh $(printf -- '-enable-upcoming-feature %s ' $FEATURES)
      - name: Swift 6 matrix as a new Xcode 26 project
        run: |
          scripts/swift6-matrix.sh -default-isolation MainActor \
            -enable-upcoming-feature InferIsolatedConformances -enable-upcoming-feature NonisolatedNonsendingByDefault
        env:
          SWIFT6_MATRIX_EXPECTED: Fixtures/Swift6/expected-failures-default-mainactor.txt

  # The runtime's DocC documentation, built with the toolchain's docc. Any docc warning (a broken symbol link, a
  # documented parameter that doesn't exist) fails the job.
  docs_linux:
    name: Documentation (Swift 6.3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build the documentation
        run: scripts/build-docs.sh

  # The release workflow's prebuilt generator, built and tested here so a change that breaks the release build
  # shows up in its PR rather than on release day. Linux only: the macOS bundle is built at release time, and a
  # `dry_run` of the Release workflow builds and tests it without publishing.
  bundle_linux:
    name: Prebuilt generator bundle on Linux (Swift 6.3)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The release builds the Linux parts on Ubuntu 22.04, for the oldest glibc they need.
    container: swift:6.3-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install zip
        run: apt-get update -qq && apt-get install -y -qq zip
      - name: Build the bundle
        run: |
          scripts/build-artifactbundle.sh build parts
          scripts/build-artifactbundle.sh merge "$(cat version)" bundle/CuckooGenerator.artifactbundle parts
      - name: Smoke test
        run: scripts/smoke-test-artifactbundle.sh bundle/CuckooGenerator.artifactbundle

  tsan_linux:
    name: Runtime tests under the Thread Sanitizer on Linux (Swift 6.3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # TSan can't map its shadow memory with the runner kernel's default ASLR entropy (32 bits on
      # Ubuntu 26.04), and a container job can't change the host's sysctl, so this job runs the Swift
      # image itself.
      - name: Lower ASLR entropy for TSan
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Runtime tests with --sanitize=thread
        run: |
          docker run --rm -v "$PWD:/src" -w /src swift:6.3 \
            swift test --sanitize=thread --filter CuckooTests

  generator_macOS:
    name: SwiftPM tests and Swift 6 matrix on ${{ matrix.runner }} (${{ matrix.build-system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, build-system: native }
          - { runner: xcode-27, build-system: swiftbuild }
    env:
      SWIFT_BUILD_FLAGS: --build-system ${{ matrix.build-system }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Show toolchain
        run: |
          ls -d /Applications/Xcode*.app
          echo "::notice title=Toolchain::$(xcodebuild -version | tr '\n' ' ')/ $(swift --version 2>&1 | head -1) / SDKROOT=${SDKROOT:-unset}"
      - name: Generator and runtime tests
        run: swift test $SWIFT_BUILD_FLAGS
      - name: Swift 6 matrix
        run: scripts/swift6-matrix.sh
      - name: Swift 6 matrix with default MainActor isolation
        run: scripts/swift6-matrix.sh -default-isolation MainActor
        env:
          SWIFT6_MATRIX_EXPECTED: Fixtures/Swift6/expected-failures-default-mainactor.txt

  test_iOS:
    name: Build and Test on Apple simulators (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Show toolchain
        run: echo "::notice title=Toolchain::$(xcodebuild -version | tr '\n' ' ')/ $(swift --version 2>&1 | head -1)"
      - name: Pick a simulator
        run: |
          # Use whichever iPhone simulator the image ships, rather than pinning a model and OS.
          SIMULATOR_ID="$(xcrun simctl list devices available iPhone | grep -m1 -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')"
          echo "::notice title=Simulator::$(xcrun simctl list devices available | grep "$SIMULATOR_ID")"
          echo "IOS_SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          # Boot it now, so its system finishes starting up while the package builds.
          xcrun simctl boot "$SIMULATOR_ID"
      # The CuckooTests scheme (scripts/install-scheme.sh) builds only the runtime side for the simulator; the
      # generator is built for macOS, as the mock plugin's tool. tvOS and watchOS are build-only: the runtime is plain
      # Swift, so what can break there is compile-time (APIs, availability, imports).
      # Xcode 26.6 also builds the generator's dependencies for the destination, so they all have to build
      # for tvOS and watchOS too. They build the arm64 slice only: the runners are Apple Silicon, and Xcode
      # 27.2's linker warns on x86_64 objects that prelink an @objc protocol with a Swift protocol inheriting
      # an Objective-C one (roadmap item 11).
      - name: Install the CuckooTests scheme
        run: scripts/install-scheme.sh
      - name: Test the package on iOS
        run: |
          set -o pipefail && xcodebuild test -scheme CuckooTests -skipPackagePluginValidation \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            | xcbeautify --renderer github-actions
      - name: Build the package tests for tvOS
        run: |
          set -o pipefail && xcodebuild build-for-testing -scheme CuckooTests -skipPackagePluginValidation \
            -destination "generic/platform=tvOS Simulator" ARCHS=arm64 \
            | xcbeautify --renderer github-actions
      - name: Build the package tests for watchOS
        run: |
          set -o pipefail && xcodebuild build-for-testing -scheme CuckooTests -skipPackagePluginValidation \
            -destination "generic/platform=watchOS Simulator" ARCHS=arm64 \
            | xcbeautify --renderer github-actions

  # The single check that master's ruleset requires. It depends on every other job, so
  # adding or removing matrix entries never leaves the ruleset requiring a stale check name.
  ci_passed:
    name: CI passed
    if: always()
    needs: [generator_linux, swift7_linux, docs_linux, bundle_linux, tsan_linux, generator_macOS, test_iOS]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
      # A matrix job's result in `needs` reads `success` even when some of its legs were cancelled, such as a macOS
      # leg that never got a runner, so every leg's own conclusion is checked too.
      - name: Fail unless every matrix leg succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          not_passed="$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?filter=latest" \
            --jq '.jobs[] | select(.name != "CI passed" and .conclusion != "success") | "\(.name): \(.conclusion // .status)"')"
          if [ -n "$not_passed" ]; then
            echo "$not_passed"
            exit 1
          fi
