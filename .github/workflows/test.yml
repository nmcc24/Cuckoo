name: Run tests
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generator_linux:
    name: Generator tests and Swift 6 matrix on Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3", "6.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Generator tests
        run: swift test
      - name: Swift 6 matrix
        run: scripts/swift6-matrix.sh

  generator_macOS:
    name: Generator tests and Swift 6 matrix on macOS 27 (Xcode 27)
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Show toolchain
        # The image's default Xcode; picking the newest installed one can select a beta.
        run: |
          ls -d /Applications/Xcode*.app
          echo "::notice title=Toolchain::$(xcodebuild -version | tr '\n' ' ')/ $(swift --version 2>&1 | head -1) / SDKROOT=${SDKROOT:-unset}"
      - name: Generator tests
        run: swift test
      - name: Swift 6 matrix
        run: scripts/swift6-matrix.sh

  build_macOS:
    name: Build Package on macOS
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: List available Xcode versions
        run: ls /Applications | grep Xcode
      - name: Show current version of Xcode
        run: xcodebuild -version
      - name: Build Package
        run: swift build

  test_macOS:
    name: Build and Test on macOS
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: List available Xcode versions
        run: ls /Applications | grep Xcode
      - name: Show current version of Xcode
        run: xcodebuild -version
      - uses: jdx/mise-action@v2
        with:
          install: false
          experimental: true
      - name: Test
        run: |
          make
          set -o pipefail && xcodebuild test -scheme "Cuckoo-macOS" -workspace Cuckoo.xcworkspace \
            | xcbeautify --renderer github-actions

  test_iOS:
    name: Build and Test on iOS simulator
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: List available Xcode versions
        run: ls /Applications | grep Xcode
      - name: Show current version of Xcode
        run: xcodebuild -version
      - uses: jdx/mise-action@v2
        with:
          install: false
          experimental: true
      - name: Test
        run: |
          make
          # Use whichever iPhone simulator the image ships, rather than pinning a model and OS.
          SIMULATOR_ID="$(xcrun simctl list devices available iPhone | grep -m1 -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')"
          echo "::notice title=Simulator::$(xcrun simctl list devices available | grep "$SIMULATOR_ID")"
          set -o pipefail && xcodebuild test -scheme "Cuckoo-iOS" -workspace Cuckoo.xcworkspace \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            | xcbeautify --renderer github-actions
