# Weekly pull requests for new releases, each validated by CI.
version: 2
updates:
  # Updates Package.resolved within Package.swift's requirements, the package's only lockfile.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    groups:
      swift-packages:
        patterns: ["*"]
    # A new swift-syntax major needs a CI leg pinning the previous one's first release (CLAUDE.md), so its upper
    # bound is raised by hand, never by Dependabot.
    ignore:
      - dependency-name: swift-syntax
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
