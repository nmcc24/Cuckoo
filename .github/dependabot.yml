# Weekly pull requests for new releases, each validated by CI.
version: 2
updates:
  # Updates Package.resolved within Package.swift's requirements, the package's only lockfile.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    groups:
      swift-packages:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
